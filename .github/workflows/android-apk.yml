name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -e
          java -version
          javac -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Verify Android source
        run: |
          set -e
          test -f android_app/app/src/main/AndroidManifest.xml
          test -f android_app/app/src/main/java/com/thefxtrader/botzw/MainActivity.java
          test -f android_app/app/build.gradle
          echo "[OK] Android source files found"

      - name: Build Debug APK
        working-directory: android_app
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="android_app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "[OK] APK created"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX_TRADER_BOT_ZW-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
