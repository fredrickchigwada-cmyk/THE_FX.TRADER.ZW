name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -e
          java -version
          javac -version

      - name: Verify Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "[OK] Android SDK detected"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android packages
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "[OK] Android 35 platform"
          echo "[OK] Build tools 35.0.0"

      - name: Verify Android source
        run: |
          set -e

          test -f android_app/app/build.gradle
          test -f android_app/app/src/main/AndroidManifest.xml
          test -f android_app/app/src/main/java/com/thefxtrader/botzw/MainActivity.java

          echo "[OK] Android source"

      - name: Build Debug APK
        working-directory: android_app
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="android_app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "[OK] APK CREATED"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX_TRADER_BOT_ZW-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
