name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        run: |
          set -e
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools"
          mkdir -p "$CMDLINE_TOOLS"

          curl -L -o "$RUNNER_TEMP/commandlinetools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          rm -rf "$CMDLINE_TOOLS/latest"
          mkdir -p "$CMDLINE_TOOLS/latest"

          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$CMDLINE_TOOLS"
          mv "$CMDLINE_TOOLS/cmdline-tools/"* "$CMDLINE_TOOLS/latest/"
          rm -rf "$CMDLINE_TOOLS/cmdline-tools"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager
        run: |
          set -e
          which sdkmanager
          sdkmanager --version

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -e
          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-35|build-tools;35.0.0'

      - name: Build APK
        working-directory: android_app
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="android_app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
