name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -e
          java -version
          javac -version

      - name: Verify Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "[OK] Android SDK detected"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Verify Android packages
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "[OK] Android 35 platform"
          echo "[OK] Build Tools 36.0.0"

      - name: Verify Android source
        run: |
          set -e

          test -f android_app/build.gradle
          test -f android_app/settings.gradle
          test -f android_app/app/build.gradle
          test -f android_app/app/src/main/AndroidManifest.xml
          test -f android_app/app/src/main/java/com/thefxtrader/botzw/MainActivity.java

          echo "[OK] Android source verified"

      - name: Run Final Pre-Release Audit
        run: |
          set -e
          python3 pre_release_check.py

      - name: Build Debug APK
        working-directory: android_app
        run: |
          set +e
          gradle assembleDebug --stacktrace > ../gradle-build.log 2>&1
          RESULT=$?

          echo "=============================================="
          echo "ANDROID BUILD RESULT"
          echo "=============================================="

          if [ "$RESULT" -eq 0 ]; then
            echo "[OK] Gradle build succeeded"
          else
            echo "[ERROR] Gradle build failed"
            echo "[ERROR] Exit code: $RESULT"
            echo
            echo "===== BUILD ERROR SUMMARY ====="
            grep -E "FAILURE:|What went wrong:|Execution failed|Could not|error:|Error:|Caused by:" ../gradle-build.log | tail -100 || true
          fi

          exit "$RESULT"

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX_TRADER_ZW-gradle-build-log
          path: android_app/gradle-build.log
          if-no-files-found: warn

      - name: Verify APK
        run: |
          set -e

          APK="android_app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "[OK] APK CREATED"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX_TRADER_BOT_ZW-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
