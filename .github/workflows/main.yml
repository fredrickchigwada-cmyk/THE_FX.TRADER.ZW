cd ~/THE_FX_TRADER_BOT_ZW

mkdir -p .github/workflows

cat > .github/workflows/android-apk.yml <<'EOF'
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android_app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh android_app/app/build/outputs/apk/debug/
          test -f android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
EOF

echo "============================================================"
echo "CHECKING GITHUB REPOSITORY"
echo "============================================================"

git remote -v
echo
git status --short

echo
echo "============================================================"
echo "ADDING ANDROID BUILD WORKFLOW"
echo "============================================================"

git add .github/workflows/android-apk.yml

git status --short

echo
echo "============================================================"
echo "COMMITTING"
echo "============================================================"

git commit -m "Add GitHub Actions Android APK build"

echo
echo "============================================================"
echo "PUSHING TO GITHUB"
echo "============================================================"

git push

echo
echo "============================================================"
echo "STAGE 18X GITHUB BUILD WORKFLOW READY"
echo "============================================================"
echo "Open the repository on GitHub -> Actions -> Build Android APK"
echo "Then run the workflow if it does not start automatically."
echo "============================================================"
