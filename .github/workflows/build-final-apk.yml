name: Build THE_FX.TRADER.BOT.ZW APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout complete bot package
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify complete Android package
        run: |
          echo "ANDROID PROJECT:"
          find android_app -maxdepth 5 -type f | sort

          echo
          echo "MANIFEST:"
          cat android_app/app/src/main/AndroidManifest.xml

          echo
          echo "MAIN ACTIVITY:"
          test -f android_app/app/src/main/java/com/thefxtrader/botzw/MainActivity.java

      - name: Build DEBUG APK
        working-directory: android_app
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Build RELEASE APK
        working-directory: android_app
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK files
        run: |
          find android_app/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          test -f android_app/app/build/outputs/apk/debug/app-debug.apk
          test -f android_app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW-release
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare release
        run: |
          mkdir -p release

          cp android_app/app/build/outputs/apk/debug/app-debug.apk \
            release/THE_FX.TRADER.BOT.ZW-debug.apk

          cp android_app/app/build/outputs/apk/release/app-release-unsigned.apk \
            release/THE_FX.TRADER.BOT.ZW-release-unsigned.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" \
            release/THE_FX.TRADER.BOT.ZW-debug.apk \
            release/THE_FX.TRADER.BOT.ZW-release-unsigned.apk \
            --title "THE_FX.TRADER.BOT.ZW APK ${{ github.run_number }}" \
            --notes "Complete Android bot package built from commit ${{ github.sha }}."
