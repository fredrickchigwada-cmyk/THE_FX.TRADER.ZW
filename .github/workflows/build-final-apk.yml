name: Build Final Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/build-final-apk.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build THE_FX.TRADER.BOT.ZW APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Android project
        working-directory: android_app
        run: |
          echo "=== PROJECT ==="
          pwd
          echo
          echo "=== MANIFEST ==="
          cat app/src/main/AndroidManifest.xml
          echo
          echo "=== APP GRADLE ==="
          cat app/build.gradle

      - name: Build debug APK
        working-directory: android_app
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        working-directory: android_app
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK information:"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android_app/app/build/outputs/apk/debug/app-debug.apk"
          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" "$APK" \
            --title "THE_FX.TRADER.BOT.ZW APK ${{ github.run_number }}" \
            --notes "Built automatically from commit ${{ github.sha }}."
