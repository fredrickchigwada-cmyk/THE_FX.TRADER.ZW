name: Build Debug and Release APKs

on:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/build-final-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build THE_FX.TRADER.BOT.ZW APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build DEBUG APK
        working-directory: android_app
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Build RELEASE APK
        working-directory: android_app
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APKs
        working-directory: android_app
        run: |
          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"

          echo "=== DEBUG APK ==="
          test -f "$DEBUG"
          ls -lh "$DEBUG"

          echo
          echo "=== RELEASE APK ==="
          test -f "$RELEASE"
          ls -lh "$RELEASE"

          echo
          echo "=== APK FILES ==="
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: THE_FX.TRADER.BOT.ZW-release
          path: android_app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Prepare release files
        run: |
          mkdir -p release
          cp android_app/app/build/outputs/apk/debug/app-debug.apk \
             release/THE_FX.TRADER.BOT.ZW-debug.apk
          cp android_app/app/build/outputs/apk/release/app-release-unsigned.apk \
             release/THE_FX.TRADER.BOT.ZW-release-unsigned.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" \
            release/THE_FX.TRADER.BOT.ZW-debug.apk \
            release/THE_FX.TRADER.BOT.ZW-release-unsigned.apk \
            --title "THE_FX.TRADER.BOT.ZW APK ${{ github.run_number }}" \
            --notes "Debug and release APK builds from commit ${{ github.sha }}."
